<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="3D 照片墙 — Three.js 磁性跟随 + 阻尼缓动" />
  <meta name="theme-color" content="#0a0b14" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>" />
  <title>3D 照片墙</title>
</head>
<body>
  <!-- WebGL canvas host -->
  <div id="gl" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- minimal interaction hint -->
  <div class="hint" id="hint" aria-hidden="true">滚动鼠标滚轮 · 逐层浏览</div>

  <!-- opening sequence: falling card stack -> FLIP viewport mask -->
  <div id="intro" aria-hidden="true"></div>

  <!-- Loading overlay -->
  <div id="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="label" id="loader-label">正在加载照片墙…</div>
    <div id="bar" aria-hidden="true"><span id="bar-fill"></span></div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0b14;color:#eef1ff;z-index:99;font-family:sans-serif;">
      本页面需要启用 JavaScript 才能展示 3D 照片墙。
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
